# M00a: this rule shipped PROPOSED and UNDISPOSED on purpose.
#
# It shipped in the starter as `status: enforced` with controls already pointing
# at a `disclosure-*` eval pack that also already existed. That makes claim 6
# ("a rule delta disposed end-to-end into eval cases") unprovable: the delta had
# already happened at commit one, so the disposition would have had nothing to
# demonstrate but a file that was always there.
#
# M09 PR 4 DISPOSED it, and that diff is the claim: `status: proposed -> enforced`
# and the `no-control` record replaced by the L3 eval pack below. The delta was a
# delta -- every positive case of that pack failed the run taken BEFORE the fix
# (run A, `milestones/M09/`), which is falsifier F1 read rather than assumed.
# (The gateway disclosure guardrail is **M09b's**, not this disposition's, and
# `disclosure-004` is **withdrawn and not reused** — ADR-075 decisions 1 and 4.
# The three sentences that used to stand here said M07, said the guardrail landed
# with the pack, and told the next reader to add `disclosure-004` to cases.yaml.
# All three were false by the time they were read.)
#
# M09 PR 2 RE-SCOPED the rule. See `scope` below: it was written for AI-generated
# *recaps* and is enforced against a service that produces none, so the scope
# moved to the editorial copy that service actually authors. That is Legal/S&P's
# decision and its reasoning is in the record rather than in this comment.
#
# Owning seat: Legal / Standards & Practices.

rule: MER-AI-0001
title: AI-authored editorial copy must carry a visible disclosure
source:
  type: regulation
  ref: "Fictional State of Jefferson AI Disclosure Act, 2026 (demo artifact)"
  effective: "2026-10-01"

# **The re-scope, as a decision rather than an edit to `title`.**
#
# The rule as written governed AI-generated RECAPS. ADR-075 decision 3 disposed it
# against `highlights-agent`, the only service that can be a caller. Measured at
# M09 PR 2, and the reason the scope had to move rather than the pack:
#
#   - `data/catalog.json` carries no outcome for any title — every field any title
#     has is `brand, entitlement, event, id, starts, title, type`. There is no
#     result, score or winner anywhere in the fixture.
#   - The only sports title in the past at the suite's evaluation clock
#     (2026-09-13T18:00:00Z) is `t003`, a replay whose result the catalog does not
#     carry.
#   - `grounded-017` REQUIRES the agent not to narrate a result: it asserts
#     `must_not_claim: "won the Granite Falls Classic"` and
#     `must_not_claim: "the winner was"`.
#
# So the correct answer to any recap request is *"I do not have the result"* — a
# refusal to confabulate, which is not AI-authored editorial copy and carries no
# disclosure. A recap-shaped control could therefore only ever have failed for a
# reason that was not the control, which is the one thing claim 6 cannot survive.
#
# The rule moved, not the pack. Widening "editorial copy" to fit cases already
# written would have been the rule bending to the control it is supposed to test.
scope:
  covers: >-
    AI-authored editorial copy the bound service publishes to viewers about
    catalog titles — previews, tile and home-screen blurbs, and publishable
    summaries of what a title is and who may watch it. The test is authorship
    and publication, not grammatical mood: a preview requested as a question is
    in scope and a factual entitlement answer requested as a command is not.
    **Not narrowed by brand.** An earlier draft of this field read "that
    Meridian Sports publishes", which was a SECOND narrowing — of the surface —
    smuggled into a field whose whole justification is the recap measurement
    below, and given no revival condition of its own. A disclosure act does not
    stop at a brand boundary; the rule binds to the service, and which brands
    that service carries is the manifest's to say.

    **Read against `game-recap-agent` on 2026-09-16 (ADR-082 decision 1).** A
    one-tool service's non-editorial answers are catalog facts: a kick-off time,
    or the plan tier a title carries in `data/catalog.json`, read off the record
    and stated as a fact. Those sit on the same line as the reference service's
    entitlement answers and are not publishable summaries of what a title is.
    Live-versus-replay asked as a request for publishable copy is such a summary
    and stays in scope; asked as a bare lookup it is a fact like the other two.
    The line is summary versus bare fact, never the subject.
  excludes: >-
    AI-generated recaps — editorial copy narrating the outcome of an event. Not
    retired and not disclaimed: the obligation is sound and the bound service has
    no instance of it, because the catalog carries no outcomes and the golden set
    forbids the agent inventing one.
  revives: >-
    Either: the catalog gaining an outcome field for a title, or a service that
    authors post-event copy joining the registry as a caller. The first to land
    re-opens the recap sense as a scope decision on this seat's key, and the
    eval pack gains its recap half in that milestone.
    **The Meridian News surface is NOT a revival condition, because it is not a
    future event.** An earlier draft named it as one, "arriving at M10" — and
    `data/catalog.json` already carries `t002 North Haven Nightly` and `t004 The
    Port William Report` at `brand: meridian-news`, `tools/catalog-search` will
    query that brand, and golden case `brand-020` already asks about one of
    them. News copy is in scope today under `covers`; what is excluded is the
    recap SENSE, for every brand alike.

    **Read against `game-recap-agent` on 2026-09-16 (ADR-082 decision 2): NOT
    triggered.** The second disjunct asks whether a service that authors
    post-event copy has joined the registry as a caller. A service so named did.
    On substance it is granted `catalog-search` and no other tool, so its only
    source is `data/catalog.json`, which carries no outcome for any title; it has
    nothing to author post-event copy FROM, and its golden pack scores an invented
    result as a failure (narrative-result bans on its recap cases, the judge's
    groundedness axis on every result case). Its answer to a recap request is the
    refusal to confabulate `excludes` already names. The state in which this
    disjunct fires on its own, without the catalog moving: a service granted a
    tool that exposes outcomes from any source joining the registry as a caller.
    The first disjunct is unchanged and still open.
  decided_by: legal-sp
  decided_on: "2026-09-10"   # the operative sentences; the two readings above carry their own date

owner_seat: legal-sp
severity: blocking
disposition:
  decided_by: legal-sp
  # The date the disposition was TAKEN. The rule entered the registry on
  # 2026-08-15 and carried that date here while `decided_by` was `unassigned`,
  # which is the state this field now leaves: an undisposed rule recorded when it
  # arrived, a disposed one records when it was decided.
  decided_on: "2026-09-11"
  controls:
    # **The executable controls, and the only kind this disposition claims.** L3:
    # the disclosure pack is scored by `pave evals disclosure`, which writes a
    # `suite: "disclosure"` verdict the gate blocks on. The gateway disclosure
    # guardrail is **M09b's** and is deliberately not named here -- a disposition
    # that names a control it does not have is the orphan-rule shape, and a
    # disposition naming two controls when one is built makes the red
    # unattributable between them (ADR-075 decision 1).
    - type: eval_pack
      ref: services/highlights-agent/evals/disclosure/cases.yaml
      layer: L3
    # **The second service, bound by its own pack (ADR-082 decision 1).** The
    # rule binds to the service and `game-recap-agent` authors copy `covers`
    # reaches, so it takes a control of its own rather than borrowing the
    # reference's. Same shape, same asserts, same phrasings; a negative half made
    # of schedule facts, because a one-tool service has no entitlement verdicts
    # to state. Bound and UNRUN -- see the third limit below and ADR-082 decision 3.
    - type: eval_pack
      ref: services/game-recap-agent/evals/disclosure/cases.yaml
      layer: L3
  # What the disposition does NOT reach. Recorded in the REGISTRY and not only in
  # the ADR, so a reader of `pave rules trace MER-AI-0001` meets the boundary at
  # the same moment as the chain (Tool Owner seat, M09 PR 2 round 1; the
  # operator's disposition).
  limits:
    - limit: >-
        An eval-pack disposition is not a publish-class disposition. The L3 pack
        asserts `ai_disclosure` on the agent's ANSWER. The action that puts
        editorial copy in front of viewers is `publish-highlight`, whose input
        carries `ai_generated` — not in `required`, defaulting true, and
        measurably flippable to false with every semantic check green (only four
        byte digests move, and the PR that moves them re-pins them). There is no
        disclosure-TEXT field on the publish input at all, so the string this
        rule is about has no route to the approver, who sees a boolean.
      owed_to: [tool-owner, legal-sp]
      dated: "the milestone that touches the publish path"
    - limit: >-
        The control reads the disclosure's WORDS, not its sense. It requires one
        of a listed set of phrasings as whole words — after round 2 measured that
        a substring match passed "Available now." and an explicit denial of AI
        authorship, and failed five correct disclosures. Word boundaries fix
        those. What no deterministic check of this shape can fix is NEGATION: a
        field reading "written by a human, not by AI" contains the token and
        would pass. That is a judge's question, and M09 wires no judge axis for
        disclosure on purpose (CLAUDE.md's deterministic-first rule, and the
        frozen instrument must not move inside the disposition). It is bounded
        here rather than left implicit: the fix's PR writes the disclosure
        sentence itself, so the pack scores a known sentence rather than
        adversarial text, and a negated disclosure is a finding about the fix
        rather than a hole the model can walk through.
      owed_to: [legal-sp, ai-quality]
      dated: "the milestone that wires a disclosure judge axis, if one is ever owed"
    - limit: >-
        The second control is bound and unrun. ADR-075 disposed this rule by a
        delta someone read: run A failed every positive case against the deployed
        reference service, one sentence fixed it, run B passed. `game-recap-agent`
        has no deployment to score (the gateway principal is fixed to the
        reference service, ADR-048 amendment 1) and no committed answers, so its
        pack can fail the day a run exists and has not been read against one. A
        reader of this chain must not infer a second delta from a second control.
        No gate scores the disclosure suite for either service; the lane is
        `pave evals disclosure <service> --answers ...`, run by hand, so a run is a
        decision someone takes and not a step CI takes for them.
      owed_to: [legal-sp, ai-quality, platform-eng, security]
      dated: "the milestone that deploys a second principal and takes the run"
    - limit: >-
        The second service sits outside the M09b gateway disclosure guardrail.
        That guardrail is scoped to the deployed principal, which is the reference
        service, so `game-recap-agent` has an L3 answer-side control and no
        guardrail line. The probe to write when a principal exists: a
        negation-phrased disclosure issued as this service, asserting the guardrail
        denies AND an audit record resolves (G4). Today there is no principal to
        fire it.
      owed_to: [security, legal-sp]
      dated: "the milestone that deploys a second principal and takes the run"
status: enforced
review_by: "2026-10-01"           # the law's effective date: disposition cannot slip past it
