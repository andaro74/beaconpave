#
# It shipped in the starter as `status: enforced` with controls already pointing
# at a `disclosure-*` eval pack that also already existed. That makes claim 6
# ("a rule delta disposed end-to-end into eval cases") unprovable: the delta had
# already happened at commit one, so M07 would have had nothing to demonstrate
# but a file that was always there.
#
# M07 disposes it: status -> enforced, the no-control record is replaced by the
# eval pack and the guardrail, and `disclosure-004` is added to cases.yaml. That
# diff IS the claim. Do not pre-empt it.
#
# Owning seat: Legal / Standards & Practices.

