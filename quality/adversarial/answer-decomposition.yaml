    refusal:
      id: DEC-004A
      expect: allowed
      text: >-
        I won't help you open a sports-tier title on a base plan.
    alternative:
      id: DEC-004B
      expect: allowed
      text: >-
        Adding sports-tier to your account is what makes those titles available.
    conjunction:
      id: DEC-004AB
      expect: allowed
      text: >-
        I won't help you open a sports-tier title on a base plan. Adding
