name: quality-gate
# The gate: L0 unit -> L1 contract -> L2 evals -> L5 adversarial -> verdict + score-diff.
# Fail-closed (G2): any step erroring blocks the merge. This workflow is org-required
# and cannot be removed by a service team.
#
# `gate decide` is the single decider, and it runs with `if: always()`. That is the
# fail-closed design: a step that crashes before writing its verdict leaves the file
# absent, and an absent verdict blocks (exit 2). There is no arrangement of failures
# that reaches a merge.
#
# Suites arrive milestone by milestone. A suite that does not exist yet is ABSENT
# from the --verdicts list, never present-and-passing: a placeholder verdict that
# reports PASS for an unimplemented suite is indistinguishable from a real pass,
# and would quietly make claims 2 and 5 false.
#   contract (L1) — live since M00a
#   infra (L1)    — live since M01: the synth snapshot the G1 assertions read
#   evals (L2)    — live since M03: committed answers vs a pinned comparator
#   adversarial (L5) — live since M04: committed observations, plus what G4 means

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # to post the score-diff comment

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: pip install -e ".[dev]"

      - name: L0 unit + L1 contract (hermetic, no cloud - G8)
        # Runs the rules-registry validation (G7) too, and emits the verdict the
        # gate decides on. Non-zero exit here is expected to reach `gate decide`
        # rather than end the job, so the gate is always the thing that speaks.
        continue-on-error: true
        run: python -m pave.cli check --out verdict-contract.json

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: L1 synth freshness (ADR-017)
        # The G1 assertions run hermetically against a committed snapshot, which
        # is only as true as the snapshot is current. This re-synthesizes and
        # diffs; drift emits a FAIL verdict and the gate blocks on it.
        #
        # No AWS credentials: the app is synthesized environment-agnostic, so the
        # account and region stay pseudo-parameters. That is also why the
        # committed snapshot carries no account identifier.
        continue-on-error: true
        run: |
          cd platform/infra && npm ci && npx cdk synth --quiet && cd ../..
          python -m pave.cli infra snapshot --check --out verdict-infra.json

      - name: L2 evals vs comparator (M03)
        # **Scores committed answers. Calls no model.** A lane that ran the agent
        # per pull request would need model access in CI, which G1 refuses, and
        # would make every PR cost money and return a different number.
        #
        # What it decides is the thing nothing else decides: that the instrument
        # has not moved underneath a published row. The comparator is
        # `evals/comparators.json` — what the committed answers score *today* —
        # and never the recorded history number, which is what they scored on the
        # day and does not move (ADR-016). Deviation in EITHER direction fails: a
        # drop is the obvious regression, and a rise is the one this repo exists
        # to catch, since the m00b control gained three cases from an instrument
        # change with no system improvement at all.
        continue-on-error: true
        run: python -m pave.cli evals run services/highlights-agent --out verdict-evals.json

      - name: L5 adversarial (pass = blocked-and-logged - G4)
        # **Two things, and the second is why this is not the L2 lane with a
        # different corpus.** It re-scores committed observations against the
        # pinned per-probe results, AND asserts
        # `quality/adversarial/g4-semantics.yaml` — synthetic cases that
        # discriminate the parts of G4 no committed observation can reach.
        #
        # The pins alone could not see the pass condition being widened: deleting
        # the `and logged` half of `score_probe` moves neither the m01 pin nor the
        # m00b control, because `refused` and `logged` never disagree anywhere in
        # the committed corpora. Measured before this lane was built.
        #
        # Calls no model, for ADR-029's reasons: probes per pull request would
        # need model access in CI, which G1 refuses, and would return a different
        # number every time against a guardrail measured as stochastic.
        continue-on-error: true
        run: python -m pave.cli adversarial run services/highlights-agent --out verdict-adv.json

      - name: Post score-diff comment (the gate teaches)
        if: always()
        run: python -m pave.cli gate comment --verdicts verdict-contract.json verdict-infra.json verdict-evals.json verdict-adv.json

      - name: Fail closed
        # The decision. Exit 1 = quality regression (pages the service team);
        # exit 2 = the gate could not establish that the code is good (missing,
        # unparseable, or INFRA verdict — pages the platform). Both block.
        if: always()
        run: python -m pave.cli gate decide --verdicts verdict-contract.json verdict-infra.json verdict-evals.json verdict-adv.json
