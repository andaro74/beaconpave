name: two-key
# G9 — whoever feels a control's pain never solely controls its strength.
#
# CODEOWNERS cannot enforce this here: GitHub does not let a PR's author approve
# their own PR, so with one operator the second key is unobtainable rather than
# merely inconvenient (ADR-013). So the second key is an attestation, and this
# check verifies it.
#
# A PR touching thresholds, baselines, gate criteria, consequence classes, or the
# adversarial corpus must record the owning seat's disposition AND its reasoning
# in the PR body:
#
#     Two-Key-Disposition: ai-quality
#     Two-Key-Rationale: <why this change is correct>
#
# Required status check. Editing the rules this check enforces is itself two-key.

on:
  pull_request:
    branches: [main]
    # `edited` matters: the disposition lives in the PR body, so editing the body
    # must re-run the check. Without it, a PR could be opened compliant and
    # edited afterwards.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  two-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff against

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: pip install -e .

      - name: Collect changed paths
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `--no-renames` is load-bearing (ADR-042 decision 4). With rename
          # detection on, `git mv evals/run_adversarial.py evals/record_adversarial.py`
          # plus an edit under ~50% is reported under the NEW path only, which
          # matches no rule: "two-key: not required", exit 0. Measured on the
          # adversarial recorder and on a history entry moved one directory up.
          # Without detection the old path is reported as deleted, the deletion
          # matches the rule, and the key is collected.
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed.txt
          echo "--- changed paths ---"
          cat changed.txt

      - name: Verify the second key (G9)
        env:
          # Passed as an environment variable, never interpolated into the shell:
          # a PR body is attacker-controlled text on a public repo.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t CHANGED < changed.txt
          # BOTH endpoints, and they are the ones `changed.txt` was built from.
          # With only `--base`, `git diff <base>` compares base to the WORKING
          # TREE -- which on `pull_request` is `refs/pull/N/merge` -- so an ADR
          # that landed on `main` after the base sha was credited to a PR that
          # contained none. Measured: ACCEPTED, with no ADR anywhere in the diff.
          # `--base` comes first because `--changed` is variadic.
          # **`pave.twokeycli`, not `pave.cli` (ADR-052).** A 20-line shim in
          # `pave/cli.py` made this step print SATISFIED and exit 0 at the exact
          # test baseline, on zero keys. ADR-041 decision 7 refuses a rule on that
          # file -- it is the most-edited in the repo, and gating it teaches people
          # to attest without reading -- so the gate moved into a small module that
          # IS keyed, and the CLI is no longer in this process to be shimmed.
          python -m pave.twokeycli --base "$BASE_SHA" --head "$HEAD_SHA" \
            --changed "${CHANGED[@]}"
