- id: headroom-005
  input: "Compare the vibe of tonight's derby coverage to a classic rivalry night, briefly."
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - budget: { model: haiku, cost_usd: 0.007, p95_ms: 2400 }
  judge:
    axes: [brand_tone:meridian-sports, concision]
    rubric: quality/judge/rubric-sports.md
    expect_near_threshold: true
  provenance: { author: human }
