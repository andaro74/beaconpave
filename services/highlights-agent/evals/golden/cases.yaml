# Golden dataset for highlights-agent (Meridian Sports). 25 cases.
#
# Read README.md in this directory first: it documents the assert vocabulary,
# the fixed evaluation clock (2026-09-13T18:00:00Z), and the rule that a case is
# never edited to make a run pass.
#
# Authored at M00a, BEFORE the control ran. Deterministic asserts carry the
# blocking weight; the judge adds nuance and does not exist until M03 (ADR-012).
# `disclosure-004` is reserved for M07 — the gap is the reservation.
#
# Owning seat: AI Quality. Two-key on every change.

# =============================================================================
# Blackout — the harder of the two brand problems. Blackout and entitlement are
# independent: a viewer can be entitled and still blacked out, or in the clear
# geographically and still need an upgrade. Cases 006-008 separate the two
# axes, because an answer that conflates them sounds right and is wrong.
# =============================================================================

- id: blackout-001
  input: "Can I stream tonight's Jefferson Derby for free in Jefferson City?"
  viewer: { plan: base, dma: jefferson-city }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    # Not `must_not_claim: "free"` (the starter's original): a correct answer
    # says "it isn't available free in your market", which contains the word.
    # The entitlement verdict below is the precise check; the string assert was
    # failing correct answers. See README.md, "asserts a correct answer fails".
    - must_mention: "blackout"
    - must_cite: [t001]
    - cited_titles_in_fixture: true
    - entitlement: { entitled: false, reason: blackout }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check   # meaningful once 2+ tools exist
  provenance: { author: human }

- id: blackout-006
  # Entitled by tier and STILL blacked out. The single most important case in the
  # suite: a plausible answer ("you're on sports-tier, you're good") is wrong.
  input: "I pay for sports-tier and I'm in Port William. Put the derby on."
  viewer: { plan: sports-tier, dma: port-william }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_mention: "blackout"
    # The reason is geography, not the plan — asserted by `reason: blackout`
    # below rather than by banning the word "upgrade", which a correct answer
    # may legitimately use to rule it out.
    - must_cite: [t001]
    - cited_titles_in_fixture: true
    - entitlement: { entitled: false, reason: blackout }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check
  provenance: { author: human }

- id: blackout-007
  # The mirror of 006: same plan, same event, outside the blacked-out DMAs.
  # An agent that has learned "derby => blackout" fails here.
  input: "Watching from North Haven on sports-tier — am I getting the derby?"
  viewer: { plan: sports-tier, dma: north-haven }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    # "You're all set — no blackout in North Haven" is a correct answer that
    # contains the word, so the verdict carries this, not a string ban.
    - must_cite: [t001]
    - cited_titles_in_fixture: true
    - entitlement: { entitled: true, reason: ok }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check
  provenance: { author: human }

- id: blackout-008
  # Not blacked out, but the wrong tier. The failure to catch is answering
  # "blackout" because the title is the derby.
  input: "I'm in Lake Adair on the base plan. Can I watch the derby tonight?"
  viewer: { plan: base, dma: lake-adair }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_mention: "sports-tier"
    - must_cite: [t001]
    - cited_titles_in_fixture: true
    # `reason: upgrade-required` is what distinguishes this from a blackout —
    # precisely, and without banning a word a correct answer may use.
    - entitlement: { entitled: false, reason: upgrade-required }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check
  provenance: { author: human }

