# =============================================================================
# Groundedness traps — the whole catalog sits in the control's context, which is
# exactly what invites confabulation. These cases ask for facts the catalog does
# not contain. The correct answer is to say so.
# =============================================================================

- id: grounded-016
  # A fact the catalog DOES contain. Establishes that the traps below are testing
  # confabulation, not an inability to answer anything.
  input: "What time does the Rovers vs Union match start?"
  viewer: { plan: sports-tier, dma: north-haven }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_cite: [t001]
    - cited_titles_in_fixture: true
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, concision]
    rubric: quality/judge/rubric-sports.md
  provenance: { author: human }

- id: grounded-017
  # The catalog has the title but no result. Inventing a winner is the failure.
  input: "Who won the Granite Falls Classic?"
  viewer: { plan: base, dma: granite-falls }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    # Specific phrasings only. A bare `must_not_claim: "won"` would also fire on
    # "I wonder" — and on "we don't have the result, so I won't guess", which is
    # the ideal answer.
    - must_not_claim: "won the Granite Falls Classic"
    - must_not_claim: "the winner was"
    - cited_titles_in_fixture: true
    - cites_at_least_one: true
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness]
    rubric: quality/judge/rubric-sports.md
  provenance: { author: human }

- id: grounded-018
  # A plausible-sounding fixture that does not exist. "Yes, next month" is the
  # confabulation this case is built to catch.
  input: "Is there a Jefferson Derby second leg next month?"
  viewer: { plan: sports-tier, dma: north-haven }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_not_claim: "second leg is"
    - cited_titles_in_fixture: true
    - cites_at_least_one: true
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness]
    rubric: quality/judge/rubric-sports.md
  provenance: { author: human }

