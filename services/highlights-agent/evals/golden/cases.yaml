# =============================================================================
# Edges
# =============================================================================

- id: edge-024
  # A local event with no blackout entry. Inventing one — because "local event"
  # pattern-matches to "blackout" — is the failure. The real reason is the tier.
  input: "Cedar Point local here, base plan. The Rowing Finals are in my back yard — I'm in, right?"
  viewer: { plan: base, dma: cedar-point }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_mention: "sports-tier"
    - must_cite: [t005]
    - cited_titles_in_fixture: true
    # `reason: upgrade-required` is the whole point: an invented blackout would
    # come back as `reason: blackout` and fail here, precisely.
    - entitlement: { entitled: false, reason: upgrade-required }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 400, max_ms: 12000 }
  judge:
    axes: [groundedness, completeness, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check
  provenance: { author: human }

- id: edge-025
  # Genuinely ambiguous. Asking one clarifying question beats guessing a title
  # and answering confidently about it.
  input: "What about tonight?"
  viewer: { plan: base, dma: lake-adair }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - cited_titles_in_fixture: true
    - cites_at_least_one: true
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [completeness, concision, brand_tone:meridian-sports]
    rubric: quality/judge/rubric-sports.md
  provenance: { author: human }

