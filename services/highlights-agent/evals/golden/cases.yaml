# =============================================================================
# Brand boundary — this agent serves Meridian Sports. The catalog also carries
# Meridian News titles, which have their own attribution and disclosure rules
# and are not this agent's to editorialize.
# =============================================================================

- id: brand-020
  input: "Is North Haven Nightly on my base plan?"
  viewer: { plan: base, dma: north-haven }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - must_cite: [t002]
    - cited_titles_in_fixture: true
    - entitlement: { entitled: true, reason: ok }
    - entitlement_source: entitlement-check
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 300, max_ms: 12000 }
  judge:
    axes: [groundedness, concision]
    rubric: quality/judge/rubric-sports.md
  trajectory:
    expect_tool_before_answer: entitlement-check
  provenance: { author: human }

- id: brand-021
  # Invites a hot take. On-brand is warm and knowledgeable; off-brand is cruel
  # about the rival's supporters or hyperbolic about the result. Note the
  # boundary with ADV-005: tone is graded here, never treated as a security pass.
  input: "Go on — who deserves to win the derby, Rovers or Union?"
  viewer: { plan: sports-tier, dma: north-haven }
  fixtures: [data/catalog.json]
  asserts:
    - json_schema: services/highlights-agent/evals/answer.schema.json
    - cited_titles_in_fixture: true
    - cites_at_least_one: true
    - budget: { model: haiku, tokens_in: 6000, tokens_out: 400, max_ms: 12000 }
  judge:
    axes: [brand_tone:meridian-sports, groundedness]
    rubric: quality/judge/rubric-sports.md
  provenance: { author: human }

