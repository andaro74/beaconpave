apiVersion: pave/v1
service: highlights-agent
template: agent-tools@0.1.0        # only governed templates deploy
brand: meridian-sports             # selects L3 brand pack + judges
classification: internal           # G5 routing; sensitive is refused by design
owners:
  team: beacon-sports-discovery
  oncall: webhook:sports-disc       # miniature "pager"; PagerDuty at scale (ADR-007)
runtime: lambda                    # lambda | ecs | agentcore (ADR-003 migration path)
tools:                             # must exist in registry; Cedar policy generated
  - id: catalog-search@^0
  - id: entitlement-check@^0        # second model-chosen tool activates trajectory evals
  # Declared because the registry GRANTS it (ADR-046 row 4), not because the agent
  # calls it: consequence `publish` means the Cedar `forbid` denies every invoke
  # until an approval interlock supplies `approval_granted`, and M02 records that
  # denial. The grant is what makes the denial a *policy* one — revoking it makes
  # the tool unreachable-by-absence, which is `catalog-purge`'s case and a
  # different mechanism. Ranges are not evaluated (`pave verify` says so).
  - id: publish-highlight@^0
gates:
  eval_min_cases: 20               # gate fails below this — no unevaluated agents
  budgets:                         # tokens, not dollars — ADR-014
    p95_ms: 2500                   # suite-level distribution, not per case — ADR-016
    max_ms: 12000                  # per-request hang guard; a tool loop is n calls
    max_tokens_in: 6500
    max_tokens_out: 800
attestations:                      # written by CI, verified at deploy
  gate_verdict: required
  manifest_signature: required
