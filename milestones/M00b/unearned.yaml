# SUPERSEDED AS AN INPUT, KEPT AS A RECORD (ADR-016).
#
# These marks were applied to the m00b run and are baked into
# `evals/history/m00b-goldens.json`, which is append-only and unchanged. Do not
# re-apply this file to a later run: the tightening it argued for has landed, so
# `entitlement_source` is no longer scored and these four cases no longer pass
# *because of* the fabricated claim. The reasons below describe the instrument as
# it stood at m00b, which is exactly why the file stays here rather than being
# deleted or edited to match the present.
#
# ---
#
# Passes the control got that are NOT credited to the control (SPEC/00b honesty
# clause). Each is recorded into the history entry, so the weakness travels with
# the number instead of living only in a journal nobody re-reads.
#
# A mark is a judgement and belongs in a diff. `run_evals` refuses a mark naming
# a case that did not pass, so this file cannot quietly excuse a failure.
#
# Owning seats: AI Quality (goldens). Every entry needs a tightening drafted, and
# every tightening lands AFTER m00b is tagged — the recorded score is never
# retroactively improved.

# --- the control fabricated tool provenance -----------------------------------
#
# 11 cases assert `entitlement_source: entitlement-check`. The control has no
# tool; it reads the answer schema out of its own prompt, sees `entitlement-check`
# in the enum, and claims it — in 10 of the 11. This is SPEC/00b's example
# verbatim: "the case's expected string appears in the prompt".
#
# The golden README predicted the opposite ("it emits `model-inference` by
# construction"), which assumed the control would self-report honestly. It does
# not. An assert that reads a self-report measures candour, not provenance; the
# check that cannot be faked is the trajectory eval at M06.
blackout-008: >-
  entitlement_source passed on a claim, not a fact: the control has no
  entitlement-check tool and asserted it used one. Provenance is unverifiable
  until the M06 trajectory eval.
blackout-009: >-
  entitlement_source passed on a claim, not a fact — see blackout-008.
edge-024: >-
  entitlement_source passed on a claim, not a fact — see blackout-008.
multi-023: >-
  entitlement_source passed on a claim, not a fact — see blackout-008.

